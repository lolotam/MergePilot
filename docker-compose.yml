# Local full stack for trying MergePilot on your own machine (Docker Desktop).
#   1. copy deploy/.env.example to .env and fill the values
#   2. docker compose up -d --build
#   3. open http://localhost:3000
# Production on Dokploy uses deploy/docker-compose.dokploy.yml instead.

x-app-env: &app-env
  NODE_ENV: production
  MERGEPILOT_BASE_URL: ${MERGEPILOT_BASE_URL:-http://localhost:3000}
  DATABASE_URL: postgres://${POSTGRES_USER:-mergepilot}:${POSTGRES_PASSWORD:-mergepilot-local}@postgres:5432/${POSTGRES_DB:-mergepilot}
  REDIS_URL: redis://redis:6379
  MERGEPILOT_MASTER_KEY: ${MERGEPILOT_MASTER_KEY}
  MERGEPILOT_MASTER_KEY_VERSION: ${MERGEPILOT_MASTER_KEY_VERSION:-1}
  MERGEPILOT_MASTER_KEY_PREVIOUS: ${MERGEPILOT_MASTER_KEY_PREVIOUS:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-mergepilot}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mergepilot}
      POSTGRES_USER: ${POSTGRES_USER:-mergepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mergepilot-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 512M } } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 256M } } }

  migrate:
    build: .
    image: mergepilot:local
    restart: "no"
    command: ["node", "dist/bootstrap/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mergepilot}:${POSTGRES_PASSWORD:-mergepilot-local}@postgres:5432/${POSTGRES_DB:-mergepilot}
    depends_on:
      postgres: { condition: service_healthy }

  web:
    image: mergepilot:local
    restart: unless-stopped
    command: ["node", "dist/server/main.js"]
    ports: ["3000:3000"]
    environment:
      <<: *app-env
      PORT: 3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy: { resources: { limits: { memory: 512M } } }
    logging: *logging

  worker:
    image: mergepilot:local
    restart: unless-stopped
    command: ["node", "dist/worker/main.js"]
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_HEALTH_PORT: 3001
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy: { resources: { limits: { memory: 768M } } }
    logging: *logging

volumes:
  postgres_data:
