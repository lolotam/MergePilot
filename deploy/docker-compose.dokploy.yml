# MergePilot on Dokploy, behind Dokploy's shared Traefik (HTTPS via Let's Encrypt).
# Postgres and Redis are reachable only on the private `backend` network. The web app and the
# worker also join `egress` (a normal network with internet access) because they must call
# GitHub and the AI providers; only `web` joins `dokploy-network` so Traefik can route to it.
# Other stacks on `dokploy-network` may also have services called `postgres`/`redis`, so the app
# reaches ours through the unique aliases `mergepilot-postgres` and `mergepilot-redis`.

# The release is pinned here (x-image) so shipping or rolling back is one edit of this file,
# independent of the secrets kept in Dokploy's Environment tab.
x-image: &image ghcr.io/lolotam/mergepilot:36f66af2a624756a2ef4aa7a7193285b47caafc3@sha256:8536da1b70d903b4980a421e673493faa61e2bd14d614e39f354d4775e3debff

# The worker runs its own pin (x-worker-image) so a release can update the web first and the
# worker in a second phase: recreating the worker waits for its drain, which must not keep the
# site down (ADR-0025 amendment). Both pins name the same image until a release splits them.
x-worker-image: &worker-image ghcr.io/lolotam/mergepilot:36f66af2a624756a2ef4aa7a7193285b47caafc3@sha256:8536da1b70d903b4980a421e673493faa61e2bd14d614e39f354d4775e3debff

x-app-env: &app-env
  NODE_ENV: production
  MERGEPILOT_BASE_URL: ${MERGEPILOT_BASE_URL:-https://mergepilot.walidmohamed.com}
  DATABASE_URL: postgres://${POSTGRES_USER:-mergepilot}:${POSTGRES_PASSWORD}@mergepilot-postgres:5432/${POSTGRES_DB:-mergepilot}
  REDIS_URL: redis://mergepilot-redis:6379
  MERGEPILOT_MASTER_KEY: ${MERGEPILOT_MASTER_KEY}
  MERGEPILOT_MASTER_KEY_VERSION: ${MERGEPILOT_MASTER_KEY_VERSION:-1}
  MERGEPILOT_MASTER_KEY_PREVIOUS: ${MERGEPILOT_MASTER_KEY_PREVIOUS:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-mergepilot}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  # Optional (ADR-0032): the Google Antigravity subscription is offered only when both are set.
  GOOGLE_ANTIGRAVITY_OAUTH_CLIENT_ID: ${GOOGLE_ANTIGRAVITY_OAUTH_CLIENT_ID:-}
  GOOGLE_ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${GOOGLE_ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  # Comma-separated emails of the platform operators who may open /admin (set in Dokploy's Environment tab).
  MERGEPILOT_PLATFORM_ADMINS: ${MERGEPILOT_PLATFORM_ADMINS:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mergepilot}
      POSTGRES_USER: ${POSTGRES_USER:-mergepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      backend:
        aliases: [mergepilot-postgres]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      backend:
        aliases: [mergepilot-redis]

  migrate:
    image: *image
    restart: "no"
    command: ["node", "dist/bootstrap/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mergepilot}:${POSTGRES_PASSWORD}@mergepilot-postgres:5432/${POSTGRES_DB:-mergepilot}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [backend]

  web:
    image: *image
    restart: unless-stopped
    command: ["node", "dist/server/main.js"]
    environment:
      <<: *app-env
      PORT: 3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.mergepilot.rule=Host(`mergepilot.walidmohamed.com`)
      - traefik.http.routers.mergepilot.entrypoints=websecure
      - traefik.http.routers.mergepilot.tls.certresolver=letsencrypt
      - traefik.http.services.mergepilot.loadbalancer.server.port=3000
    logging: *logging
    networks: [backend, egress, dokploy-network]

  worker:
    image: *worker-image
    restart: unless-stopped
    command: ["node", "dist/worker/main.js"]
    # On SIGTERM the worker stops taking jobs and waits for the running reviews to finish
    # (worker.close()); Docker kills it after this period. 10s is Docker's default; the owner
    # decides a longer drain by setting WORKER_STOP_GRACE_PERIOD in Dokploy (ADR-0025).
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-10s}
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      WORKER_HEALTH_PORT: 3001
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging
    networks: [backend, egress]

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    internal: true
  egress: {}
  dokploy-network:
    external: true
